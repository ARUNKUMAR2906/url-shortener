spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/urlshortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: app
    password: app_pass

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: 127.0.0.1
      port: 6379

app:
  base-url: https://short.ly/
  cache:
    ttl-hours: 1